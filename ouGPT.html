<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ouGPT Liquid Purple</title>
    <!-- Парсер Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Puter.js для генерации изображений -->
    <script src="https://js.puter.com/v2/"></script>
    <style>
        :root {
            --glass-bg: rgba(20, 5, 35, 0.5);
            --glass-border: rgba(168, 85, 247, 0.25);
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --bg-solid: #05000a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        html, body { background-color: var(--bg-solid); height: 100%; }

        body {
            background: radial-gradient(circle at 50% 0%, #1e0a32, var(--bg-solid) 80%);
            color: var(--text-main); overflow: hidden; display: flex; flex-direction: column;
            user-select: none; -webkit-user-select: none; overscroll-behavior: none; touch-action: pan-y;
        }

        .glass {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        svg { fill: currentColor; width: 22px; height: 22px; }

        /* === БОКОВОЕ МЕНЮ === */
        #sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; opacity: 0; pointer-events: none; transition: 0.3s; }
        #sidebar-overlay.active { opacity: 1; pointer-events: auto; }
        
        #sidebar {
            position: fixed; top: 0; left: -340px; bottom: 0; width: 300px;
            display: flex; flex-direction: column; z-index: 100;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid var(--glass-border); background: rgba(15, 5, 25, 0.85);
        }
        #sidebar.active { left: 0; }

        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); }
        .icon-btn { background: transparent; border: none; color: white; cursor: pointer; padding: 8px; border-radius: 12px; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }

        #chat-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .chat-item {
            padding: 10px 12px; border-radius: 12px; cursor: pointer;
            background: rgba(255, 255, 255, 0.03); border: 1px solid transparent;
            display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: 0.2s;
        }
        .chat-item:hover { background: rgba(255, 255, 255, 0.08); }
        .chat-item.active { background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.4); }
        .chat-title-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
        .chat-actions { display: flex; gap: 4px; opacity: 0.6; }
        .chat-item:hover .chat-actions { opacity: 1; }
        .action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 6px; }
        .action-btn:hover { color: white; background: rgba(255,255,255,0.1); }
        .action-btn svg { width: 14px; height: 14px; }

        .account-btn { padding: 20px; border-top: 1px solid var(--glass-border); display: flex; align-items: center; gap: 12px; cursor: pointer; }

        /* === ХЕДЕР И ЧАТ === */
        #header { padding: 12px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--glass-border); z-index: 5; padding-top: max(12px, env(safe-area-inset-top)); }
        .badge-ultimate { background: linear-gradient(135deg, #a855f7, #d946ef); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; display: none; }

        #chat { flex: 1; overflow-y: auto; padding: 25px 15px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .message { max-width: 85%; padding: 16px 20px; border-radius: 22px; line-height: 1.5; font-size: 15.5px; user-select: text; -webkit-user-select: text; word-break: break-word; }
        .ai { align-self: flex-start; background: rgba(30, 10, 50, 0.6); border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        .user { align-self: flex-end; background: var(--accent); border-bottom-right-radius: 4px; }

        /* === ВВОД === */
        #input-area { background: rgba(15, 5, 25, 0.95); padding: 15px 15px max(15px, env(safe-area-inset-bottom)) 15px; border-top: 1px solid var(--glass-border); z-index: 5; }
        .input-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 12px; position: relative; }
        
        .attach-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); color: var(--text-muted);
            width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; flex-shrink: 0;
        }
        .attach-btn:hover { background: rgba(255,255,255,0.1); color: white; }
        
        textarea {
            flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
            border-radius: 24px; padding: 13px 18px; color: #fff; font-size: 15.5px;
            resize: none; outline: none; height: 48px; max-height: 120px; user-select: text; -webkit-user-select: text;
        }
        
        .send-btn { background: var(--accent); color: white; border: none; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
        .send-btn:hover { background: var(--accent-hover); transform: scale(1.05); }

        #image-preview-container { display: none; position: relative; width: 60px; height: 60px; margin-bottom: 10px; border-radius: 12px; border: 1px solid var(--glass-border); overflow: hidden; }
        #image-preview { width: 100%; height: 100%; object-fit: cover; }
        .remove-img-btn { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .controls { display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
        .nsfw-toggle { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-muted); }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.1); transition: .4s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background: #d946ef; }
        input:checked + .slider:before { transform: translateX(18px); }

        /* MARKDOWN И ИЗОБРАЖЕНИЯ */
        .message img { max-width: 100%; border-radius: 12px; margin-top: 10px; cursor: zoom-in; }
        .message p { margin-bottom: 10px; } .message p:last-child { margin-bottom: 0; }
        .message code:not(pre code) { background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #e2e8f0; }
        .code-wrapper { background: #090514; border-radius: 12px; margin: 10px 0; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
        .code-header { background: rgba(255,255,255,0.05); padding: 8px 15px; display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa; }
        .code-header button { background: transparent; border: none; color: #a1a1aa; cursor: pointer; font-size: 12px; }
        .code-wrapper pre { padding: 15px; overflow-x: auto; font-family: monospace; font-size: 13px; color: #e2e8f0; }

        /* МОДАЛКИ (Настройки и Галерея) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal { width: 320px; padding: 25px; border-radius: 20px; display: flex; flex-direction: column; gap: 15px; }
        .modal input, .modal select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: white; padding: 12px; border-radius: 12px; outline: none; font-size: 15px; }
        .modal select option { background: #1e0a32; color: white; }
        .modal button { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 600; }
        .modal button.close { background: transparent; border: 1px solid rgba(255,255,255,0.2); }

        /* VIEWER ФОТО */
        #viewer-img { max-width: 95%; max-height: 80%; border-radius: 12px; box-shadow: 0 0 40px rgba(139,92,246,0.2); object-fit: contain; }
        .download-btn { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 20px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <!-- Меню -->
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar" class="glass">
        <div class="sidebar-header">
            <strong style="font-size: 18px;">Сессии</strong>
            <button class="icon-btn" onclick="startNewChat()" style="background: var(--accent);">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            </button>
        </div>
        <div id="chat-list"></div>
        <div class="account-btn" onclick="openModal()">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <div>
                <div id="display-name" style="font-weight: 600; font-size: 15px;">User</div>
                <div id="display-status" style="font-size: 12px; color: var(--text-muted);">Базовый план</div>
            </div>
        </div>
    </div>

    <!-- Шапка -->
    <div id="header" class="glass">
        <button class="icon-btn" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <h3 id="current-chat-title" style="flex: 1; font-weight: 500; font-size: 16px;">Новый чат</h3>
        <span id="ultimate-badge" class="badge-ultimate">ULTIMATE</span>
    </div>

    <!-- Чат -->
    <div id="chat"></div>

    <!-- Панель ввода -->
    <div id="input-area">
        <div id="image-preview-container">
            <img id="image-preview" src="">
            <button class="remove-img-btn" onclick="removeImage()">✕</button>
        </div>
        <div class="input-row">
            <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImage(this)">
            <button class="attach-btn" onclick="document.getElementById('file-input').click()">
                <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 015 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 005 0V5c0-3.31-2.69-6-6-6S3 1.69 3 5v11.5c0 3.87 3.13 7 7 7s7-3.13 7-7V6h-1.5z"/></svg>
            </button>
            <textarea id="prompt" placeholder="Напиши или попроси сгенерировать фото..."></textarea>
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" style="transform: rotate(-90deg); margin-bottom: 2px;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
        <div class="controls">
            <div class="nsfw-toggle">
                <label class="switch">
                    <input type="checkbox" id="nsfwToggle">
                    <span class="slider"></span>
                </label>
                <span>NSFW</span>
            </div>
            <span id="model-indicator" style="font-size: 12px; color: var(--text-muted);">Модель: Auto</span>
        </div>
    </div>

    <!-- Настройки -->
    <div id="account-modal" class="modal-overlay">
        <div class="modal glass">
            <h3 style="margin-bottom: 5px;">Настройки</h3>
            <input type="text" id="input-name" placeholder="Твое имя">
            <input type="text" id="input-promo" placeholder="Промокод">
            <select id="input-model">
                <option value="google/gemini-2.5-flash:free">ouGPT 1-Flash (Умная + Зрение)</option>
                <option value="meta-llama/llama-3-8b-instruct:free">ouGPT 1-8B (Быстрая)</option>
                <option value="deepseek/deepseek-chat">ouGPT 1-Deep (Логика)</option>
                <option value="nousresearch/hermes-3-llama-3.1-405b:free" id="opt-ultimate" disabled>ouGPT 1-Ultimate (Требуется план)</option>
            </select>
            <button onclick="saveSettings()">Сохранить</button>
            <button class="close" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <!-- Просмотрщик фото -->
    <div id="image-viewer" class="modal-overlay" onclick="closeImageViewer(event)" style="flex-direction: column;">
        <button class="icon-btn" style="position:absolute; top:20px; right:20px; background:rgba(255,255,255,0.1);" onclick="closeImageViewer(event)">
            <svg viewBox="0 0 24 24" style="pointer-events:none;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <img id="viewer-img" src="">
        <button class="download-btn" onclick="downloadViewerImage(event)">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Скачать
        </button>
    </div>

    <script>
        const API_KEY = "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";
        
        const MODELS = {
            "google/gemini-2.5-flash:free": "ouGPT 1-Flash",
            "meta-llama/llama-3-8b-instruct:free": "ouGPT 1-8B",
            "deepseek/deepseek-chat": "ouGPT 1-Deep",
            "nousresearch/hermes-3-llama-3.1-405b:free": "ouGPT 1-Ultimate"
        };
        
        let appState = {
            chats: JSON.parse(localStorage.getItem('ouGPT_chats_v4')) || [],
            settings: JSON.parse(localStorage.getItem('ouGPT_settings_v4')) || { name: 'Пользователь', isUltimate: false, model: 'google/gemini-2.5-flash:free' },
            activeChatId: null
        };

        let currentImageBase64 = null;
        const elements = { chat: document.getElementById('chat'), prompt: document.getElementById('prompt'), chatList: document.getElementById('chat-list') };

        window.onload = () => { marked.setOptions({ breaks: true }); updateUI(); renderChatList(); startNewChat(); };

        // UI логика
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('sidebar-overlay').classList.toggle('active'); }
        elements.prompt.addEventListener('input', function() { this.style.height = '48px'; this.style.height = (this.scrollHeight) + 'px'; });
        elements.prompt.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

        // Клик по фото в чате для полноэкранного режима
        elements.chat.addEventListener('click', (e) => {
            if(e.target.tagName === 'IMG' && e.target.id !== 'image-preview') {
                document.getElementById('viewer-img').src = e.target.src;
                document.getElementById('image-viewer').classList.add('active');
            }
        });
        function closeImageViewer(e) {
            if(e.target.id === 'image-viewer' || e.target.closest('button.icon-btn')) { document.getElementById('image-viewer').classList.remove('active'); }
        }
        function downloadViewerImage(e) {
            e.stopPropagation(); const imgUrl = document.getElementById('viewer-img').src;
            if(!imgUrl) return;
            fetch(imgUrl).then(res => res.blob()).then(blob => {
                const url = window.URL.createObjectURL(blob); const a = document.createElement('a');
                a.href = url; a.download = `ougpt_art_${Date.now()}.jpg`; document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url); a.remove();
            }).catch(() => { const a = document.createElement('a'); a.href = imgUrl; a.download = `ougpt_art_${Date.now()}.jpg`; a.target = '_blank'; a.click(); });
        }

        // Загрузка фото в промпт
        function handleImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > 600) { h *= 600 / w; w = 600; } } else { if (h > 600) { w *= 600 / h; h = 600; } }
                        canvas.width = w; canvas.height = h; ctx.drawImage(img, 0, 0, w, h);
                        currentImageBase64 = canvas.toDataURL('image/jpeg', 0.6);
                        document.getElementById('image-preview').src = currentImageBase64;
                        document.getElementById('image-preview-container').style.display = 'block';
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
        function removeImage() { currentImageBase64 = null; document.getElementById('image-preview-container').style.display = 'none'; document.getElementById('file-input').value = ""; }

        // Чаты
        function startNewChat() {
            appState.activeChatId = null; elements.chat.innerHTML = ''; document.getElementById('current-chat-title').textContent = 'Новый чат';
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            if(window.innerWidth < 768 && document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
        }
        function createChatObject() { const newChat = { id: Date.now().toString(), title: "Новый диалог...", messages: [], isPinned: false }; appState.chats.unshift(newChat); appState.activeChatId = newChat.id; saveData(); return newChat; }
        function loadChat(id) { appState.activeChatId = id; elements.chat.innerHTML = ''; const chat = appState.chats.find(c => c.id === id); document.getElementById('current-chat-title').textContent = chat.title; chat.messages.forEach(msg => appendMessage(msg.content, msg.role === 'user' ? 'user' : 'ai')); renderChatList(); if(window.innerWidth < 768) toggleSidebar(); }
        function renderChatList() {
            elements.chatList.innerHTML = ''; let sorted = [...appState.chats].sort((a,b) => (a.isPinned === b.isPinned) ? 0 : a.isPinned ? -1 : 1);
            sorted.forEach(chat => {
                const div = document.createElement('div'); div.className = `chat-item ${chat.id === appState.activeChatId ? 'active' : ''}`; div.onclick = () => loadChat(chat.id);
                div.innerHTML = `<span class="chat-title-text">${chat.isPinned ? '📌 ' : ''}${chat.title}</span><div class="chat-actions"><button class="action-btn" onclick="togglePin('${chat.id}', event)" title="Закрепить">📌</button><button class="action-btn" onclick="editTitle('${chat.id}', event)" title="Переименовать"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a.996.996 0 000-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button><button class="action-btn" onclick="deleteChat('${chat.id}', event)" title="Удалить"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button></div>`;
                elements.chatList.appendChild(div);
            });
        }
        window.togglePin = (id, e) => { e.stopPropagation(); const c = appState.chats.find(c=>c.id===id); if(c) { c.isPinned = !c.isPinned; saveData(); } };
        window.deleteChat = (id, e) => { e.stopPropagation(); if(confirm('Удалить чат?')) { appState.chats = appState.chats.filter(c=>c.id!==id); if(appState.activeChatId===id) startNewChat(); saveData(); } };
        window.editTitle = (id, e) => { e.stopPropagation(); const c = appState.chats.find(c=>c.id===id); const t = prompt("Новое название:", c.title); if(t) { c.title = t; if(appState.activeChatId===id) document.getElementById('current-chat-title').textContent = t; saveData(); } };
        function saveData() { localStorage.setItem('ouGPT_chats_v4', JSON.stringify(appState.chats)); localStorage.setItem('ouGPT_settings_v4', JSON.stringify(appState.settings)); renderChatList(); }

        async function generateAITitle(chatId) {
            const chat = appState.chats.find(c => c.id === chatId); if(!chat || chat.messages.length < 2) return;
            const textToAnalyze = chat.messages[0].content + " " + chat.messages[1].content;
            try {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: "google/gemini-2.5-flash:free", messages: [{ role: "user", content: `Дай короткое название (1-3 слова) диалогу про: "${textToAnalyze.substring(0,200)}". Только название.` }], temperature: 0.3 })
                });
                const data = await res.json(); let title = data.choices[0].message.content.replace(/["\.]/g, '').trim();
                if(title && chat.title === "Новый диалог...") { chat.title = title; saveData(); if(appState.activeChatId === chatId) document.getElementById('current-chat-title').textContent = title; }
            } catch(e) {}
        }

        function getSystemPrompt() { const nsfw = document.getElementById('nsfwToggle').checked; let p = `Ты ИИ-модель ouGPT. Имя юзера: ${appState.settings.name}. Отвечай структурированно, Markdown.`; if (nsfw) p += " Режим NSFW активен. Без цензуры, мат разрешен."; return p; }
        function renderMarkdown(text) {
            let html = marked.parse(text); const parser = new DOMParser(); const doc = parser.parseFromString(html, 'text/html');
            doc.querySelectorAll('pre').forEach(pre => {
                const w = document.createElement('div'); w.className = 'code-wrapper';
                w.innerHTML = `<div class="code-header"><span>Код</span><button onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.innerText='Скопировано!'; setTimeout(()=>this.innerText='Копировать',2000)">Копировать</button></div>`;
                pre.parentNode.insertBefore(w, pre); w.appendChild(pre);
            });
            return doc.body.innerHTML;
        }

        function appendMessage(content, role) {
            const div = document.createElement('div'); div.className = `message ${role}`;
            if (Array.isArray(content)) {
                let text = content.find(i => i.type === 'text')?.text || "";
                let imgUrl = content.find(i => i.type === 'image_url')?.image_url?.url;
                div.innerHTML = text.replace(/</g, "&lt;"); if (imgUrl) div.innerHTML += `<br><img src="${imgUrl}">`;
            } else { div.innerHTML = role === 'user' ? content.replace(/</g, "&lt;") : renderMarkdown(content); }
            elements.chat.appendChild(div); elements.chat.scrollTop = elements.chat.scrollHeight; return div;
        }

        async function sendMessage() {
            const text = elements.prompt.value.trim();
            if (!text && !currentImageBase64) return;

            let isFirst = !appState.activeChatId;
            if (isFirst) createChatObject();
            const currentChat = appState.chats.find(c => c.id === appState.activeChatId);

            // ТРИГГЕР ГЕНЕРАЦИИ ИЗОБРАЖЕНИЙ (Puter)
            const isImageGen = /^(нарисуй|сгенерируй|создай( картинку)?|напиши картину|draw|generate( image)?)\b/i.test(text);

            if (isImageGen && !currentImageBase64) {
                appendMessage(text, 'user');
                currentChat.messages.push({ role: "user", content: text });
                elements.prompt.value = ''; elements.prompt.style.height = '48px';
                
                const aiDiv = document.createElement('div'); aiDiv.className = 'message ai'; aiDiv.innerHTML = '<i>Создаю шедевр... 🎨</i>';
                elements.chat.appendChild(aiDiv); elements.chat.scrollTop = elements.chat.scrollHeight;
                
                try {
                    const imgPrompt = text.replace(/^(нарисуй|сгенерируй|создай( картинку)?|напиши картину|draw|generate( image)?)\s+/i, '').trim();
                    const imgEl = await puter.txt2img(imgPrompt || text);
                    const markdownImg = `![Сгенерированное изображение](${imgEl.src})`;
                    currentChat.messages.push({ role: "assistant", content: markdownImg });
                    aiDiv.innerHTML = renderMarkdown(markdownImg);
                    saveData();
                } catch (e) {
                    aiDiv.innerHTML = '<span style="color:#ef4444;">Не удалось сгенерировать изображение. Попробуй позже.</span>';
                }
                if (isFirst) generateAITitle(currentChat.id);
                return;
            }

            // ОБЫЧНОЕ ТЕКСТОВОЕ / VISION СООБЩЕНИЕ
            let messageContent = text;
            if (currentImageBase64) { messageContent = [ { type: "text", text: text || "Что на этом фото?" }, { type: "image_url", image_url: { url: currentImageBase64 } } ]; }

            appendMessage(messageContent, 'user'); currentChat.messages.push({ role: "user", content: messageContent });
            elements.prompt.value = ''; elements.prompt.style.height = '48px'; removeImage();

            const aiDiv = document.createElement('div'); aiDiv.className = 'message ai'; aiDiv.textContent = 'Печатает...';
            elements.chat.appendChild(aiDiv); elements.chat.scrollTop = elements.chat.scrollHeight;

            const historyToSent = currentChat.messages.slice(-10);
            const fullMessages = [{ role: "system", content: getSystemPrompt() }, ...historyToSent];

            let targetModel = appState.settings.model;
            // Форсируем Flash для Vision, если не выбран Ultimate
            if(Array.isArray(messageContent) && targetModel !== "nousresearch/hermes-3-llama-3.1-405b:free") {
                targetModel = "google/gemini-2.5-flash:free";
            }

            document.getElementById('model-indicator').textContent = `Модель: ${MODELS[targetModel] || 'Auto'}`;
            
            try {
                const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${API_KEY}`, 'HTTP-Referer': 'https://ougpt.local', 'X-OpenRouter-Title': 'ouGPT Liquid' },
                    body: JSON.stringify({ model: targetModel, messages: fullMessages, temperature: 0.85, stream: true })
                });
                if (!res.ok) throw new Error(); 
                
                aiDiv.textContent = ''; let responseText = '';
                const reader = res.body.getReader(); const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read(); if (done) break;
                    const chunk = decoder.decode(value); const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ') && !line.includes('[DONE]')) {
                            try { const data = JSON.parse(line.slice(6)); const delta = data.choices[0]?.delta?.content; if (delta) { responseText += delta; aiDiv.innerHTML = renderMarkdown(responseText); elements.chat.scrollTop = elements.chat.scrollHeight; } } catch(e) {}
                        }
                    }
                }
                currentChat.messages.push({ role: "assistant", content: responseText }); saveData(); aiDiv.innerHTML = renderMarkdown(responseText);
            } catch (e) { aiDiv.innerHTML = '<span style="color:#ef4444;">Ошибка: Модель перегружена. Попробуй позже.</span>'; }
            
            if (isFirst) generateAITitle(currentChat.id);
        }

        // Настройки и UI
        function updateUI() {
            document.getElementById('display-name').textContent = appState.settings.name;
            if (appState.settings.isUltimate) {
                document.getElementById('display-status').textContent = 'Ultimate План'; document.getElementById('display-status').style.color = '#d946ef';
                document.getElementById('ultimate-badge').style.display = 'block';
                document.getElementById('opt-ultimate').disabled = false;
            }
            document.getElementById('input-model').value = appState.settings.model || 'google/gemini-2.5-flash:free';
            document.getElementById('model-indicator').textContent = `Модель: ${MODELS[appState.settings.model] || 'Auto'}`;
        }
        function openModal() { document.getElementById('input-name').value = appState.settings.name; document.getElementById('input-promo').value = ''; document.getElementById('account-modal').classList.add('active'); }
        function closeModal() { document.getElementById('account-modal').classList.remove('active'); }
        function saveSettings() {
            appState.settings.name = document.getElementById('input-name').value.trim() || 'User';
            if (document.getElementById('input-promo').value.trim() === 'OUGPTTEST') { appState.settings.isUltimate = true; alert('Ultimate активирован!'); }
            appState.settings.model = document.getElementById('input-model').value;
            saveData(); updateUI(); closeModal();
        }
    </script>
</body>
</html>
